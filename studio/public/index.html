<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CharlieHV Portfolio Visual Studio</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root {
      --bg-canvas: #0c0d0e;
      --bg-surface: #141618;
      --bg-card: #1a1c1e;
      --bg-card-hover: #222528;
      --border-subtle: #272a2e;
      --border-focus: #3b82f6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-subtle: #6b7280;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-canvas);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Navigation */
    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      z-index: 50;
      flex-shrink: 0;
    }

    .header-left, .header-center, .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-pill {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
    }

    .brand-pill .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    .project-selector {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      outline: none;
      cursor: pointer;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-main);
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: var(--bg-card-hover);
      border-color: #3f444a;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .view-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      display: flex;
      padding: 2px;
      gap: 2px;
    }

    .view-toggle button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.35rem 0.65rem;
      font-size: 0.8rem;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
    }

    .view-toggle button.active {
      background: #2a2d32;
      color: #fff;
    }

    /* Workspace */
    .workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
      overflow: hidden;
      position: relative;
    }

    /* Asset Drawer */
    .asset-drawer {
      width: 320px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.2s ease;
      z-index: 40;
    }

    .asset-drawer.collapsed {
      width: 0;
      overflow: hidden;
      border-right: none;
    }

    .drawer-header {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .drawer-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-title-row h3 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .search-input {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 0.4rem 0.65rem;
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
      width: 100%;
    }

    .folder-pills {
      display: flex;
      gap: 0.35rem;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .folder-pills::-webkit-scrollbar { display: none; }

    .folder-pill {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-subtle);
      padding: 0.2rem 0.5rem;
      font-size: 0.72rem;
      border-radius: 9999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .folder-pill.active {
      background: #2a2e34;
      color: #fff;
      border-color: #4b5563;
    }

    .asset-grid {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.65rem;
      align-content: start;
    }

    .asset-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      overflow: hidden;
      cursor: grab;
      transition: all 0.15s ease;
    }
    .asset-card:hover {
      border-color: #4b5563;
      transform: translateY(-2px);
    }

    .asset-thumb-wrap {
      aspect-ratio: 16/10;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .asset-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .asset-info {
      padding: 0.4rem;
    }
    .asset-name {
      font-size: 0.75rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-muted);
    }
    .asset-tag {
      font-size: 0.65rem;
      color: var(--text-subtle);
    }

    /* Editor Canvas */
    .editor-canvas-wrap {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .editor-container {
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem 8rem;
    }

    /* Project Header Card */
    .project-header-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .project-header-card h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .project-header-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
    }

    /* DRAGGABLE PAGE BLOCK WRAPPER */
    .page-block-wrapper {
      position: relative;
      margin-bottom: 1.5rem;
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .page-block-wrapper.block-dragging {
      opacity: 0.3;
      border: 2px dashed var(--accent);
      transform: scale(0.99);
    }

    .page-block-wrapper.block-drag-over {
      border-top: 4px solid var(--accent);
      padding-top: 8px;
    }

    /* Block Header Bar (with Drag Handle & Controls) */
    .block-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.85rem;
      background: #17191c;
      border: 1px solid var(--border-subtle);
      border-bottom: none;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
    }

    .block-drag-title {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: grab;
      user-select: none;
    }
    .block-drag-title:active { cursor: grabbing; }

    .block-drag-badge {
      background: #25282c;
      color: #93c5fd;
      border: 1px solid #3b82f6;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .block-drag-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      max-width: 400px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .block-controls {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .mini-btn {
      background: #202327;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mini-btn:hover {
      background: #2d3137;
      color: #fff;
    }
    .mini-btn.danger:hover {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    /* TEXT BLOCK CARD */
    .text-block-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      padding: 1.25rem;
      position: relative;
    }

    .text-format-toolbar {
      display: flex;
      gap: 4px;
      margin-bottom: 0.85rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
    }

    .fmt-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .fmt-btn:hover {
      background: #2c3138;
      color: #fff;
    }

    .editable-text-content {
      color: var(--text-main);
      font-size: 0.95rem;
      line-height: 1.65;
      min-height: 60px;
      outline: none;
      padding: 0.5rem;
      border-radius: 6px;
      transition: background 0.15s ease;
    }
    .editable-text-content:focus {
      background: rgba(255,255,255,0.02);
      box-shadow: inset 0 0 0 1px var(--border-focus);
    }

    .editable-text-content h1,
    .editable-text-content h2,
    .editable-text-content h3 {
      color: #fff;
      margin-bottom: 0.5rem;
      margin-top: 0.5rem;
    }
    .editable-text-content p { margin-bottom: 0.75rem; }
    .editable-text-content ul, .editable-text-content ol {
      margin-left: 1.5rem;
      margin-bottom: 0.75rem;
    }

    .raw-html-editor {
      width: 100%;
      min-height: 120px;
      background: #090a0b;
      color: #10b981;
      font-family: monospace;
      font-size: 0.85rem;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 0.75rem;
      display: none;
      outline: none;
    }

    /* IMAGE GROUP CARD */
    .image-group-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      padding: 1.25rem;
    }

    .layout-picker {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
      margin-left: 0.5rem;
    }

    .layout-btn {
      background: transparent;
      border: none;
      color: var(--text-subtle);
      padding: 0.2rem 0.5rem;
      font-size: 0.75rem;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
    }
    .layout-btn.active {
      background: #2a2e34;
      color: #fff;
    }

    .images-stage {
      display: grid;
      gap: 1rem;
      min-height: 140px;
      position: relative;
      margin-top: 0.5rem;
    }

    .images-stage.single { grid-template-columns: 1fr; }
    .images-stage.grid-2 { grid-template-columns: repeat(2, 1fr); }
    .images-stage.grid-3 { grid-template-columns: repeat(3, 1fr); }
    .images-stage.grid-4 { grid-template-columns: repeat(4, 1fr); }

    .canvas-image-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      cursor: grab;
      transition: all 0.15s ease;
    }
    .canvas-image-card:hover { border-color: #4b5563; }
    .canvas-image-card:active { cursor: grabbing; }

    .card-preview-wrap {
      width: 100%;
      height: 180px;
      background: #090a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .card-preview-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .card-drag-handle {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0,0,0,0.75);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      padding: 4px 6px;
      color: #fff;
      font-size: 0.75rem;
      cursor: grab;
    }

    .card-actions-overlay {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      background: rgba(0,0,0,0.75);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: #fff;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .icon-btn:hover { background: var(--danger); }

    .card-meta {
      padding: 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      background: var(--bg-card);
      border-top: 1px solid var(--border-subtle);
    }

    .card-src-tag {
      font-size: 0.7rem;
      font-family: monospace;
      color: var(--text-subtle);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-alt-input {
      background: #111315;
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 0.3rem 0.5rem;
      color: var(--text-main);
      font-size: 0.78rem;
      outline: none;
      width: 100%;
    }

    /* Finder Dropzone */
    .block-dropzone {
      margin-top: 1rem;
      border: 2px dashed var(--border-subtle);
      border-radius: 8px;
      padding: 1.25rem 1rem;
      text-align: center;
      color: var(--text-subtle);
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255,255,255,0.01);
    }
    .block-dropzone:hover, .block-dropzone.drag-active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(59, 130, 246, 0.05);
    }

    /* Insert Divider */
    .insert-block-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 1.5rem 0;
      position: relative;
    }
    .insert-block-divider::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--border-subtle);
      z-index: 1;
    }
    .insert-btn-group {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 0.5rem;
      background: var(--bg-canvas);
      padding: 0 0.75rem;
    }

    /* Preview Iframe */
    .preview-split-wrap {
      flex: 1;
      height: 100%;
      border-left: 1px solid var(--border-subtle);
      background: #000;
      display: none;
      flex-direction: column;
    }
    .preview-split-wrap.visible { display: flex; }

    .preview-topbar {
      height: 40px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .preview-iframe {
      width: 100%;
      height: calc(100% - 40px);
      border: none;
      background: #fff;
    }

    /* Lightbox */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 2rem;
    }
    .modal-overlay.active { display: flex; }
    .modal-img-container {
      max-width: 90vw;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .modal-img-container img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 8px;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
    }
    .toast {
      background: #1e2124;
      border: 1px solid #32363b;
      color: #fff;
      padding: 0.75rem 1.15rem;
      border-radius: 8px;
      font-size: 0.85rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="header-left">
      <div class="brand-pill">
        <span class="dot"></span>
        <span>Portfolio Visual Studio</span>
      </div>
      <button class="btn" id="toggleDrawerBtn">📁 Asset Library</button>
      <select class="project-selector" id="projectSelector">
        <option value="" disabled>Loading...</option>
      </select>
    </div>

    <div class="header-center">
      <div class="view-toggle">
        <button id="viewEditorBtn" class="active">Editor Layout</button>
        <button id="viewSplitBtn">Split Screen Preview</button>
        <button id="viewFullPreviewBtn">Live Site</button>
      </div>
    </div>

    <div class="header-right">
      <span class="badge" id="statusBadge" style="display: none;">● Staged</span>
      <button class="btn" id="copyPromptBtn">📋 Copy Prompt for AI</button>
      <button class="btn btn-primary" id="saveBtn">💾 Save &amp; Stage Changes</button>
    </div>
  </header>

  <!-- Workspace -->
  <div class="workspace">

    <!-- Asset Drawer -->
    <div class="asset-drawer" id="assetDrawer">
      <div class="drawer-header">
        <div class="drawer-title-row">
          <h3>Media Library</h3>
          <span class="badge" id="assetCountBadge">0 assets</span>
        </div>
        <input type="text" class="search-input" id="assetSearchInput" placeholder="Filter images..." />
        <div class="folder-pills" id="folderPills">
          <button class="folder-pill active" data-folder="all">All</button>
        </div>
      </div>
      <div class="asset-grid" id="assetGrid"></div>
    </div>

    <!-- Canvas -->
    <div class="editor-canvas-wrap" id="editorCanvasWrap">
      <div class="editor-container" id="editorContainer"></div>
    </div>

    <!-- Live Preview Split -->
    <div class="preview-split-wrap" id="previewSplitWrap">
      <div class="preview-topbar">
        <span id="previewUrlLabel">http://localhost:4321/projects/...</span>
        <button class="btn" id="refreshPreviewBtn" style="padding: 2px 8px; font-size: 0.75rem;">↻ Reload</button>
      </div>
      <iframe class="preview-iframe" id="previewIframe" src="about:blank"></iframe>
    </div>

  </div>

  <!-- Lightbox Modal -->
  <div class="modal-overlay" id="lightboxModal" onclick="closeLightbox()">
    <div class="modal-img-container" onclick="event.stopPropagation()">
      <img id="lightboxImg" src="" alt="Enlarged preview" />
      <p id="lightboxCaption" style="color: #9ca3af; margin-top: 10px; font-size: 0.9rem;"></p>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <!-- Application Logic -->
  <script>
    let currentSlug = 'creative-direction';
    let currentProjectData = null;
    let allProjects = [];
    let allAssets = [];
    let activeFolderFilter = 'all';
    let isDirty = false;
    let draggedBlockIdx = null;

    const projectSelector = document.getElementById('projectSelector');
    const editorContainer = document.getElementById('editorContainer');
    const assetGrid = document.getElementById('assetGrid');
    const assetCountBadge = document.getElementById('assetCountBadge');
    const folderPills = document.getElementById('folderPills');
    const assetSearchInput = document.getElementById('assetSearchInput');
    const toggleDrawerBtn = document.getElementById('toggleDrawerBtn');
    const assetDrawer = document.getElementById('assetDrawer');
    const saveBtn = document.getElementById('saveBtn');
    const copyPromptBtn = document.getElementById('copyPromptBtn');
    const viewEditorBtn = document.getElementById('viewEditorBtn');
    const viewSplitBtn = document.getElementById('viewSplitBtn');
    const viewFullPreviewBtn = document.getElementById('viewFullPreviewBtn');
    const previewSplitWrap = document.getElementById('previewSplitWrap');
    const previewIframe = document.getElementById('previewIframe');
    const previewUrlLabel = document.getElementById('previewUrlLabel');
    const refreshPreviewBtn = document.getElementById('refreshPreviewBtn');
    const statusBadge = document.getElementById('statusBadge');

    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<span>${type === 'success' ? '✅' : 'ℹ️'}</span> <span>${message}</span>`;
      document.getElementById('toastContainer').appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    async function init() {
      await loadProjects();
      await loadAssets();
      setupEventListeners();
      loadProject(currentSlug);
    }

    async function loadProjects() {
      try {
        const res = await fetch('/api/projects');
        const data = await res.json();
        if (data.ok) {
          allProjects = data.projects;
          projectSelector.innerHTML = '';
          allProjects.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.slug;
            opt.textContent = `${p.title} (${p.imageCount} imgs)`;
            projectSelector.appendChild(opt);
          });
          projectSelector.value = currentSlug;
        }
      } catch (err) {
        console.error('Failed to load projects', err);
      }
    }

    async function loadAssets() {
      try {
        const res = await fetch('/api/assets');
        const data = await res.json();
        if (data.ok) {
          allAssets = data.assets;
          buildFolderPills();
          renderAssets();
        }
      } catch (err) {}
    }

    function buildFolderPills() {
      const folders = new Set();
      allAssets.forEach(a => folders.add(a.folder));
      folderPills.innerHTML = '<button class="folder-pill active" data-folder="all">All</button>';
      folders.forEach(f => {
        const btn = document.createElement('button');
        btn.className = 'folder-pill';
        btn.dataset.folder = f;
        btn.textContent = f;
        btn.onclick = () => {
          document.querySelectorAll('.folder-pill').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeFolderFilter = f;
          renderAssets();
        };
        folderPills.appendChild(btn);
      });
      folderPills.querySelector('[data-folder="all"]').onclick = (e) => {
        document.querySelectorAll('.folder-pill').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        activeFolderFilter = 'all';
        renderAssets();
      };
    }

    function renderAssets() {
      const query = assetSearchInput.value.toLowerCase().trim();
      const filtered = allAssets.filter(a => {
        const matchFolder = activeFolderFilter === 'all' || a.folder === activeFolderFilter;
        const matchQuery = !query || a.name.toLowerCase().includes(query) || a.folder.toLowerCase().includes(query);
        return matchFolder && matchQuery;
      });

      assetCountBadge.textContent = `${filtered.length} assets`;
      assetGrid.innerHTML = '';

      filtered.forEach(asset => {
        const card = document.createElement('div');
        card.className = 'asset-card';
        card.draggable = true;

        card.innerHTML = `
          <div class="asset-thumb-wrap">
            <img src="${asset.previewUrl}" alt="${asset.name}" loading="lazy" />
          </div>
          <div class="asset-info">
            <div class="asset-name" title="${asset.name}">${asset.name}</div>
            <div class="asset-tag">${asset.folder}</div>
          </div>
        `;

        card.onclick = () => openLightbox(asset.previewUrl, `${asset.name} (${asset.folder})`);

        card.ondragstart = (e) => {
          e.dataTransfer.setData('text/plain', JSON.stringify({
            src: asset.publicUrl || asset.previewUrl,
            rawPath: asset.relPath,
            name: asset.name,
            isRaw: asset.isRaw
          }));
        };

        assetGrid.appendChild(card);
      });
    }

    async function loadProject(slug) {
      currentSlug = slug;
      projectSelector.value = slug;
      updatePreviewIframe();
      editorContainer.innerHTML = '<div style="text-align: center; padding: 4rem; color: #9ca3af;">Loading project content...</div>';

      try {
        const res = await fetch(`/api/project/${slug}`);
        const data = await res.json();
        if (data.ok) {
          currentProjectData = data;
          renderProjectEditor();
        }
      } catch (err) {
        editorContainer.innerHTML = `<div style="color: #ef4444; padding: 2rem;">Error: ${err.message}</div>`;
      }
    }

    function renderProjectEditor() {
      if (!currentProjectData) return;
      editorContainer.innerHTML = '';

      // Project Header Card
      const headerCard = document.createElement('div');
      headerCard.className = 'project-header-card';
      const imgTotal = currentProjectData.isPhotography
        ? currentProjectData.photos.length
        : (currentProjectData.blocks || []).filter(b => b.type === 'image-group').reduce((acc, g) => acc + (g.images?.length || 0), 0);

      headerCard.innerHTML = `
        <div>
          <h1>${currentProjectData.title || currentSlug}</h1>
          <p>Slug: <code>/projects/${currentSlug}</code></p>
          <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem;">
            <span class="badge">${imgTotal} Images</span>
            <span class="badge">${currentProjectData.blocks?.length || currentProjectData.photos?.length || 0} Draggable Blocks</span>
          </div>
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <button class="btn" onclick="insertNewBlock(0, 'text')">+ Text at Top</button>
          <button class="btn" onclick="insertNewBlock(0, 'image')">+ Image at Top</button>
        </div>
      `;
      editorContainer.appendChild(headerCard);

      if (currentProjectData.isPhotography) {
        renderPhotographyEditor();
      } else {
        renderCaseStudyBlocks();
      }
    }

    // Render Full-Page Draggable & Editable Blocks
    function renderCaseStudyBlocks() {
      const blocks = currentProjectData.blocks || [];

      blocks.forEach((block, idx) => {
        // Block Wrapper (Draggable Container)
        const wrapper = document.createElement('div');
        wrapper.className = 'page-block-wrapper';
        wrapper.id = `block_wrapper_${idx}`;
        wrapper.dataset.blockIndex = idx;

        // Block Header with Drag Handle & Controls
        const header = document.createElement('div');
        header.className = 'block-header-bar';

        const isText = block.type === 'text';
        let labelSnippet = '';
        if (isText) {
          const div = document.createElement('div');
          div.innerHTML = block.content;
          labelSnippet = (div.textContent || '').slice(0, 40) || 'Text Section';
        } else {
          labelSnippet = `${(block.layout || 'grid-2').toUpperCase()} • ${block.images?.length || 0} images`;
        }

        header.innerHTML = `
          <div class="block-drag-title" draggable="true" title="Drag to move this entire section to a new position">
            <span class="block-drag-badge">⠿ Block ${idx + 1}</span>
            <span class="block-drag-label">${isText ? '📝 ' + labelSnippet : '🖼️ ' + labelSnippet}</span>
            ${!isText ? `
              <div class="layout-picker">
                <button class="layout-btn ${block.layout === 'single' ? 'active' : ''}" onclick="changeGroupLayout(${idx}, 'single')">1 Col</button>
                <button class="layout-btn ${block.layout === 'grid-2' ? 'active' : ''}" onclick="changeGroupLayout(${idx}, 'grid-2')">2 Grid</button>
                <button class="layout-btn ${block.layout === 'grid-3' ? 'active' : ''}" onclick="changeGroupLayout(${idx}, 'grid-3')">3 Grid</button>
                <button class="layout-btn ${block.layout === 'grid-4' ? 'active' : ''}" onclick="changeGroupLayout(${idx}, 'grid-4')">4 Grid</button>
              </div>
            ` : ''}
          </div>
          <div class="block-controls">
            <button class="mini-btn" title="Move Up" onclick="moveBlock(${idx}, -1)">▲</button>
            <button class="mini-btn" title="Move Down" onclick="moveBlock(${idx}, 1)">▼</button>
            <button class="mini-btn danger" title="Delete Block" onclick="deleteBlock(${idx})">✕</button>
          </div>
        `;

        // Handle Drag & Drop of the Block
        const dragHandle = header.querySelector('.block-drag-title');
        dragHandle.ondragstart = (e) => {
          draggedBlockIdx = idx;
          wrapper.classList.add('block-dragging');
          e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'reorder-block', fromIdx: idx }));
        };
        dragHandle.ondragend = () => {
          wrapper.classList.remove('block-dragging');
          draggedBlockIdx = null;
          document.querySelectorAll('.page-block-wrapper').forEach(w => w.classList.remove('block-drag-over'));
        };

        wrapper.ondragover = (e) => {
          e.preventDefault();
          if (draggedBlockIdx !== null && draggedBlockIdx !== idx) {
            wrapper.classList.add('block-drag-over');
          }
        };

        wrapper.ondragleave = () => wrapper.classList.remove('block-drag-over');

        wrapper.ondrop = (e) => {
          e.preventDefault();
          wrapper.classList.remove('block-drag-over');
          const raw = e.dataTransfer.getData('text/plain');
          if (!raw) return;
          try {
            const data = JSON.parse(raw);
            if (data.type === 'reorder-block') {
              const fromIdx = data.fromIdx;
              const toIdx = idx;
              if (fromIdx !== toIdx) {
                const moved = currentProjectData.blocks.splice(fromIdx, 1)[0];
                currentProjectData.blocks.splice(toIdx, 0, moved);
                renderCaseStudyBlocks();
                markDirty();
                showToast(`Moved block to position #${toIdx + 1}!`, 'success');
              }
            }
          } catch (err) {}
        };

        wrapper.appendChild(header);

        // Render Block Body (Text or Image Group)
        if (isText) {
          const textCard = createTextBlockCard(block, idx);
          wrapper.appendChild(textCard);
        } else {
          const imgCard = createImageGroupCard(block, idx);
          wrapper.appendChild(imgCard);
        }

        editorContainer.appendChild(wrapper);

        // Insert divider between blocks
        const divider = document.createElement('div');
        divider.className = 'insert-block-divider';
        divider.innerHTML = `
          <div class="insert-btn-group">
            <button class="mini-btn" onclick="insertNewBlock(${idx + 1}, 'text')">+ Add Text Section</button>
            <button class="mini-btn" onclick="insertNewBlock(${idx + 1}, 'image')">+ Add Image Group</button>
          </div>
        `;
        editorContainer.appendChild(divider);
      });
    }

    // Create Text Block Card with Inline Rich Editing & Formatting Tools
    function createTextBlockCard(block, idx) {
      const card = document.createElement('div');
      card.className = 'text-block-card';

      // Mini-formatting toolbar
      const toolbar = document.createElement('div');
      toolbar.className = 'text-format-toolbar';
      toolbar.innerHTML = `
        <button class="fmt-btn" title="Bold (Cmd+B)" onclick="execFormat('bold')">B</button>
        <button class="fmt-btn" title="Italic (Cmd+I)" onclick="execFormat('italic')">I</button>
        <button class="fmt-btn" title="Heading 2" onclick="execFormat('formatBlock', '<h2>')">H2</button>
        <button class="fmt-btn" title="Heading 3" onclick="execFormat('formatBlock', '<h3>')">H3</button>
        <button class="fmt-btn" title="Paragraph" onclick="execFormat('formatBlock', '<p>')">P</button>
        <button class="fmt-btn" title="Bullet List" onclick="execFormat('insertUnorderedList')">• Bullet List</button>
        <button class="fmt-btn" title="Toggle Raw HTML" onclick="toggleRawHtml(${idx})">⇄ Raw HTML</button>
      `;
      card.appendChild(toolbar);

      // Editable container
      const editable = document.createElement('div');
      editable.className = 'editable-text-content';
      editable.contentEditable = 'true';
      editable.id = `editable_text_${idx}`;
      editable.innerHTML = block.content;

      // Sync changes on input/blur
      editable.oninput = () => {
        block.content = editable.innerHTML;
        markDirty();
      };

      // Raw textarea fallback
      const textarea = document.createElement('textarea');
      textarea.className = 'raw-html-editor';
      textarea.id = `raw_textarea_${idx}`;
      textarea.value = block.content;
      textarea.oninput = () => {
        block.content = textarea.value;
        editable.innerHTML = textarea.value;
        markDirty();
      };

      card.appendChild(editable);
      card.appendChild(textarea);
      return card;
    }

    // Execute rich text formatting
    function execFormat(cmd, val = null) {
      document.execCommand(cmd, false, val);
      markDirty();
    }

    // Toggle Raw HTML Code View
    function toggleRawHtml(idx) {
      const editable = document.getElementById(`editable_text_${idx}`);
      const textarea = document.getElementById(`raw_textarea_${idx}`);
      if (textarea.style.display === 'block') {
        textarea.style.display = 'none';
        editable.style.display = 'block';
        editable.innerHTML = textarea.value;
      } else {
        textarea.value = editable.innerHTML;
        textarea.style.display = 'block';
        editable.style.display = 'none';
      }
    }

    // Create Image Group Card with Grids & Images
    function createImageGroupCard(block, blockIdx) {
      const card = document.createElement('div');
      card.className = 'image-group-card';

      const layout = block.layout || 'grid-2';
      const stage = document.createElement('div');
      stage.className = `images-stage ${layout}`;
      stage.id = `imgStage_${blockIdx}`;

      (block.images || []).forEach((img, imgIdx) => {
        const imgCard = createSingleImageCard(blockIdx, img, imgIdx);
        stage.appendChild(imgCard);
      });
      card.appendChild(stage);

      // Dropzone for adding files directly from Finder or Asset Drawer
      const dropzone = createDropzone(blockIdx, (newImg) => {
        if (!block.images) block.images = [];
        block.images.push(newImg);
        renderCaseStudyBlocks();
        markDirty();
      });
      card.appendChild(dropzone);

      return card;
    }

    // Single Image Card in Grid
    function createSingleImageCard(blockIdx, img, imgIdx) {
      const card = document.createElement('div');
      card.className = 'canvas-image-card';
      card.draggable = true;

      card.innerHTML = `
        <div class="card-preview-wrap">
          <img src="${img.src}" alt="${img.alt || ''}" />
          <div class="card-drag-handle">⠿ ${imgIdx + 1}</div>
          <div class="card-actions-overlay">
            <button class="icon-btn" title="View Zoom" onclick="openLightbox('${img.src}', '${img.alt || ''}')">🔍</button>
            <button class="icon-btn" title="Remove" onclick="removeImageFromGroup(${blockIdx}, ${imgIdx})">✕</button>
          </div>
        </div>
        <div class="card-meta">
          <div class="card-src-tag" title="${img.src}">${img.src}</div>
          <input type="text" class="card-alt-input" value="${img.alt || ''}" placeholder="Alt description..." onchange="updateImageAlt(${blockIdx}, ${imgIdx}, this.value)" />
        </div>
      `;

      card.ondragstart = (e) => {
        card.classList.add('dragging');
        e.dataTransfer.setData('text/plain', JSON.stringify({
          type: 'reorder-image',
          fromBlockIdx: blockIdx,
          fromImgIdx: imgIdx,
          img: img
        }));
      };

      card.ondragend = () => card.classList.remove('dragging');

      card.ondragover = (e) => {
        e.preventDefault();
        card.classList.add('drag-over');
      };
      card.ondragleave = () => card.classList.remove('drag-over');

      card.ondrop = (e) => {
        e.preventDefault();
        card.classList.remove('drag-over');
        const raw = e.dataTransfer.getData('text/plain');
        if (!raw) return;
        try {
          const data = JSON.parse(raw);
          if (data.type === 'reorder-image') {
            const fromBlock = currentProjectData.blocks[data.fromBlockIdx];
            const toBlock = currentProjectData.blocks[blockIdx];
            if (fromBlock && toBlock) {
              const moved = fromBlock.images.splice(data.fromImgIdx, 1)[0];
              toBlock.images.splice(imgIdx, 0, moved);
              renderCaseStudyBlocks();
              markDirty();
            }
          } else if (data.src || data.isRaw) {
            handleAssetDrawerDrop(blockIdx, data, imgIdx);
          }
        } catch (err) {}
      };

      return card;
    }

    // Move any block up or down on the page
    function moveBlock(idx, dir) {
      const targetIdx = idx + dir;
      if (targetIdx >= 0 && targetIdx < currentProjectData.blocks.length) {
        const item = currentProjectData.blocks.splice(idx, 1)[0];
        currentProjectData.blocks.splice(targetIdx, 0, item);
        renderCaseStudyBlocks();
        markDirty();
        showToast(`Moved block to position #${targetIdx + 1}!`, 'success');
      }
    }

    // Delete a block
    function deleteBlock(idx) {
      if (confirm('Delete this entire section?')) {
        currentProjectData.blocks.splice(idx, 1);
        renderCaseStudyBlocks();
        markDirty();
      }
    }

    // Change layout of image group
    function changeGroupLayout(idx, newLayout) {
      currentProjectData.blocks[idx].layout = newLayout;
      renderCaseStudyBlocks();
      markDirty();
    }

    // Remove single image from group
    function removeImageFromGroup(blockIdx, imgIdx) {
      currentProjectData.blocks[blockIdx].images.splice(imgIdx, 1);
      renderCaseStudyBlocks();
      markDirty();
    }

    function updateImageAlt(blockIdx, imgIdx, val) {
      currentProjectData.blocks[blockIdx].images[imgIdx].alt = val;
      markDirty();
    }

    // Insert new block at index (text or image)
    function insertNewBlock(insertIdx, type) {
      let newBlock;
      if (type === 'text') {
        newBlock = {
          id: `block_text_${Date.now()}`,
          type: 'text',
          content: `<h2>New Section Heading</h2>\n<p>Enter your case study narrative, insights, or analysis here...</p>`
        };
      } else {
        newBlock = {
          id: `block_img_${Date.now()}`,
          type: 'image-group',
          layout: 'grid-2',
          images: [],
          caption: ''
        };
      }

      currentProjectData.blocks.splice(insertIdx, 0, newBlock);
      renderCaseStudyBlocks();
      markDirty();
      showToast(`Inserted new ${type} block at #${insertIdx + 1}!`, 'success');
    }

    // Dropzone logic
    function createDropzone(blockIdx, onAddCallback) {
      const dropzone = document.createElement('div');
      dropzone.className = 'block-dropzone';
      dropzone.innerHTML = `
        <div>📥 <strong>Drop images here</strong> from Mac Finder or Asset Library</div>
        <div style="font-size: 0.75rem; opacity: 0.7;">Click to browse local files</div>
      `;

      dropzone.onclick = () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.multiple = true;
        input.onchange = async (e) => {
          for (const file of e.target.files) {
            await uploadFileDirectly(file, onAddCallback);
          }
        };
        input.click();
      };

      dropzone.ondragover = (e) => {
        e.preventDefault();
        dropzone.classList.add('drag-active');
      };
      dropzone.ondragleave = () => dropzone.classList.remove('drag-active');

      dropzone.ondrop = async (e) => {
        e.preventDefault();
        dropzone.classList.remove('drag-active');

        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          for (const file of e.dataTransfer.files) {
            await uploadFileDirectly(file, onAddCallback);
          }
          return;
        }

        const raw = e.dataTransfer.getData('text/plain');
        if (raw) {
          try {
            const data = JSON.parse(raw);
            await handleAssetDrawerDrop(blockIdx, data);
          } catch (err) {}
        }
      };

      return dropzone;
    }

    async function uploadFileDirectly(file, onAddCallback) {
      showToast(`Uploading ${file.name}...`);
      const reader = new FileReader();
      reader.onload = async () => {
        const base64Data = reader.result;
        try {
          const res = await fetch('/api/upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              project: currentSlug,
              filename: file.name,
              base64Data: base64Data
            })
          });
          const result = await res.json();
          if (result.ok) {
            showToast(`Uploaded ${result.filename}!`, 'success');
            onAddCallback({
              id: `img_${Date.now()}_${Math.random().toString(36).substring(2,6)}`,
              src: result.src,
              alt: file.name.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' '),
              loading: 'lazy'
            });
          }
        } catch (err) {
          showToast(`Upload failed: ${err.message}`);
        }
      };
      reader.readAsDataURL(file);
    }

    async function handleAssetDrawerDrop(blockIdx, assetData, insertIdx = null) {
      let finalSrc = assetData.src;

      if (assetData.isRaw && assetData.rawPath) {
        showToast(`Copying ${assetData.name} to site...`);
        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            project: currentSlug,
            filename: assetData.name,
            rawPath: assetData.rawPath
          })
        });
        const result = await res.json();
        if (result.ok) finalSrc = result.src;
      }

      const newImg = {
        id: `img_${Date.now()}_${Math.random().toString(36).substring(2,6)}`,
        src: finalSrc,
        alt: assetData.name.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' '),
        loading: 'lazy'
      };

      const block = currentProjectData.blocks[blockIdx];
      if (block) {
        if (!block.images) block.images = [];
        if (insertIdx !== null) block.images.splice(insertIdx, 0, newImg);
        else block.images.push(newImg);
        renderCaseStudyBlocks();
        markDirty();
        showToast(`Added ${assetData.name}!`, 'success');
      }
    }

    // Photography Gallery Mode
    function renderPhotographyEditor() {
      const card = document.createElement('div');
      card.className = 'image-group-card';
      card.innerHTML = `<div style="font-weight: 600; margin-bottom: 1rem;">Photography Gallery (${currentProjectData.photos.length} photos)</div>`;

      const stage = document.createElement('div');
      stage.className = 'images-stage grid-3';

      currentProjectData.photos.forEach((photo, idx) => {
        const photoCard = document.createElement('div');
        photoCard.className = 'canvas-image-card';
        photoCard.draggable = true;

        photoCard.innerHTML = `
          <div class="card-preview-wrap">
            <img src="${photo.src}" alt="${photo.alt || ''}" />
            <div class="card-drag-handle">⠿ ${idx + 1}</div>
            <div class="card-actions-overlay">
              <button class="icon-btn" onclick="removePhoto(${idx})">✕</button>
            </div>
          </div>
          <div class="card-meta">
            <div class="card-src-tag">${photo.src}</div>
            <input type="text" class="card-alt-input" value="${photo.alt || ''}" onchange="currentProjectData.photos[${idx}].alt = this.value; markDirty();" />
          </div>
        `;

        photoCard.ondragstart = (e) => {
          e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'reorder-photo', index: idx }));
        };
        photoCard.ondragover = (e) => e.preventDefault();
        photoCard.ondrop = (e) => {
          e.preventDefault();
          const raw = e.dataTransfer.getData('text/plain');
          if (!raw) return;
          try {
            const data = JSON.parse(raw);
            if (data.type === 'reorder-photo') {
              const moved = currentProjectData.photos.splice(data.index, 1)[0];
              currentProjectData.photos.splice(idx, 0, moved);
              renderPhotographyEditor();
              markDirty();
            }
          } catch (err) {}
        };

        stage.appendChild(photoCard);
      });

      card.appendChild(stage);

      const dropzone = createDropzone(0, (newImg) => {
        currentProjectData.photos.push(newImg);
        renderPhotographyEditor();
        markDirty();
      });
      card.appendChild(dropzone);
      editorContainer.appendChild(card);
    }

    function removePhoto(idx) {
      if (confirm('Remove photo?')) {
        currentProjectData.photos.splice(idx, 1);
        renderPhotographyEditor();
        markDirty();
      }
    }

    function markDirty() {
      isDirty = true;
      statusBadge.style.display = 'inline-flex';
      statusBadge.textContent = '● Changes Pending';
      statusBadge.style.background = '#854d0e';
      statusBadge.style.color = '#fef08a';
    }

    async function saveCurrentProject() {
      if (!currentProjectData) return;
      saveBtn.textContent = 'Saving...';
      saveBtn.disabled = true;

      try {
        const payload = currentProjectData.isPhotography
          ? { photos: currentProjectData.photos }
          : { blocks: currentProjectData.blocks };

        const res = await fetch(`/api/project/${currentSlug}/save`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        if (result.ok) {
          isDirty = false;
          statusBadge.textContent = '✅ Staged';
          statusBadge.style.background = '#065f46';
          statusBadge.style.color = '#a7f3d0';
          showToast(`Saved changes to ${currentSlug}!`, 'success');
          updatePreviewIframe();
        } else {
          showToast(`Save failed: ${result.error}`);
        }
      } catch (err) {
        showToast(`Save error: ${err.message}`);
      } finally {
        saveBtn.textContent = '💾 Save & Stage Changes';
        saveBtn.disabled = false;
      }
    }

    function updatePreviewIframe() {
      const targetUrl = `http://localhost:4321/projects/${currentSlug}`;
      previewUrlLabel.textContent = targetUrl;
      previewIframe.src = targetUrl;
    }

    function openLightbox(src, caption) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightboxCaption').textContent = caption || '';
      document.getElementById('lightboxModal').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightboxModal').classList.remove('active');
    }

    function copyPromptForAI() {
      const prompt = `Hey Antigravity, I just finished reordering the layout, editing text, and updating images for "${currentProjectData?.title || currentSlug}" in Portfolio Studio. Please incorporate the staged changes, verify the Astro build, and push/commit the changes!`;
      navigator.clipboard.writeText(prompt).then(() => {
        showToast('Prompt copied to clipboard! Paste it into our chat.', 'success');
      });
    }

    function setupEventListeners() {
      projectSelector.onchange = (e) => {
        if (isDirty && !confirm('You have unsaved changes. Discard and switch?')) {
          projectSelector.value = currentSlug;
          return;
        }
        loadProject(e.target.value);
      };

      saveBtn.onclick = saveCurrentProject;
      copyPromptBtn.onclick = copyPromptForAI;

      window.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 's') {
          e.preventDefault();
          saveCurrentProject();
        }
        if (e.key === 'Escape') closeLightbox();
      });

      toggleDrawerBtn.onclick = () => assetDrawer.classList.toggle('collapsed');
      assetSearchInput.oninput = renderAssets;

      viewEditorBtn.onclick = () => {
        viewEditorBtn.classList.add('active');
        viewSplitBtn.classList.remove('active');
        viewFullPreviewBtn.classList.remove('active');
        previewSplitWrap.classList.remove('visible');
        document.getElementById('editorCanvasWrap').style.display = 'flex';
      };

      viewSplitBtn.onclick = () => {
        viewSplitBtn.classList.add('active');
        viewEditorBtn.classList.remove('active');
        viewFullPreviewBtn.classList.remove('active');
        previewSplitWrap.classList.add('visible');
        document.getElementById('editorCanvasWrap').style.display = 'flex';
        updatePreviewIframe();
      };

      viewFullPreviewBtn.onclick = () => {
        viewFullPreviewBtn.classList.add('active');
        viewEditorBtn.classList.remove('active');
        viewSplitBtn.classList.remove('active');
        previewSplitWrap.classList.add('visible');
        document.getElementById('editorCanvasWrap').style.display = 'none';
        updatePreviewIframe();
      };

      refreshPreviewBtn.onclick = () => {
        previewIframe.src = previewIframe.src;
      };
    }

    window.onload = init;
  </script>
</body>
</html>
